```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Nazr Quran Center</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#ffffff;
    font-family:Arial, sans-serif;
}

/* Fullscreen container */
#app{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* Loading screen */
#loader{
    position:fixed;
    inset:0;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999999;
}

.spinner{
    width:50px;
    height:50px;
    border:5px solid #e5e5e5;
    border-top:5px solid #1e88e5;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

/* Webview */
iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
}

/* Cover Base44 badge */
.hide-badge{
    position:fixed;
    bottom:0;
    right:0;
    width:90px;
    height:90px;
    background:#ffffff;
    z-index:99999;
    pointer-events:none;
}

/* Mobile adjustments */
@media (max-width:768px){

    .hide-badge{
        width:80px;
        height:80px;
    }

    .spinner{
        width:40px;
        height:40px;
    }
}
</style>
</head>

<body>

<div id="loader">
    <div class="spinner"></div>
</div>

<div id="app">
    <iframe
        id="webview"
        src="https://nazr-quran-center.base44.app/"
        allowfullscreen>
    </iframe>
</div>

<div class="hide-badge"></div>

<script>
const iframe = document.getElementById("webview");

iframe.onload = function () {
    document.getElementById("loader").style.display = "none";
};

// Fallback if loading takes too long
setTimeout(() => {
    document.getElementById("loader").style.display = "none";
}, 8000);
</script>

</body>
</html>
```

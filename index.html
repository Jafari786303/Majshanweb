
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nazr Quran Center</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* Small floating button */
.floating-banner{
    position:fixed;
    right:10px;
    bottom:10px;

    z-index:999999;

    background:#0f766e;
    color:white;

    padding:8px 14px;
    border-radius:20px;

    font-family:Arial,sans-serif;
    font-size:12px;
    font-weight:bold;

    box-shadow:0 4px 12px rgba(0,0,0,.25);

    cursor:pointer;
}

.floating-banner:hover{
    opacity:0.9;
}

@media (max-width:768px){
    .floating-banner{
        right:6px;
        bottom:6px;
        font-size:11px;
        padding:7px 12px;
    }
}
</style>
</head>

<body>

<iframe src="https://nazr-quran-center.base44.app/"></iframe>

<div class="floating-banner">
    Free Trial Class
</div>

</body>
</html>

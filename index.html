<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazr Quran Center</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        .window-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* This visually covers up the bottom right corner where the Base44 badge sits */
        .banner-shield {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 180px; /* Adjust width to perfectly match the badge size */
            height: 90px;  /* Adjust height to perfectly match the badge size */
            background-color: #ffffff; /* Change this to match the website's background color */
            z-index: 99999;
            pointer-events: auto; /* Blocks clicks from hitting the badge underneath */
        }
    </style>
</head>
<body>

    <div class="window-container">
        <iframe src="https://nazr-quran-center.base44.app/"></iframe>
        <div class="banner-shield"></div>
    </div>

</body>
</html>

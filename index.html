```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Nazr Quran Center</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
}

.viewport{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/*
 * Push the watermark off-screen
 * while keeping the UI usable.
 */
iframe{
    position:absolute;
    top:0;
    left:0;

    width:calc(100% + 60px);
    height:calc(100% + 60px);

    border:none;

    transform:translate(-10px,-10px);
}

/* Mobile */
@media (max-width:768px){

    iframe{
        width:calc(100% + 70px);
        height:calc(100% + 70px);

        transform:translate(-15px,-15px);
    }

}
</style>
</head>

<body>

<div class="viewport">
    <iframe
        src="https://nazr-quran-center.base44.app/"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
```

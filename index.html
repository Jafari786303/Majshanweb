<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazr Quran Center</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* The container cuts off any element pushed past its edges */
        .app-viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* REVERSE-SQUEEZE:
           We expand the frame slightly past the bottom right corner, 
           then scale the entire frame up minutely using CSS transform. 
           This drops the Base44 watermark off the physical screen grid 
           without breaking the responsive grid or cutting your help button.
        */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% + 120px); 
            height: calc(100% + 60px);
            border: none;
            transform: scale(1);
            transform-origin: top left;
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <iframe src="https://nazr-quran-center.base44.app/"></iframe>
    </div>

</body>
</html>
